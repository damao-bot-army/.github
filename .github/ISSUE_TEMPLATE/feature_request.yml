name: Feature request
description: Suggest an improvement or a new feature.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea. Describe the problem and the outcome you want.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you considered.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples or other relevant details. Do not include credentials or personal data.
    validations:
      required: false
